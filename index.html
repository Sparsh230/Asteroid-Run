<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asteroid Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c" tabindex="0" autofocus></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),k={},a=[],b=[];
let w,h,p=0,s=0,g=1;
function size(){w=c.width=innerWidth;h=c.height=innerHeight}
onresize=size;size();
onkeydown=e=>{
 let z=e.code||e.key;
 if(z==='d'||z==='D')z='KeyD';
 if(z==='a'||z==='A')z='KeyA';
 k[z]=1;
 if((z==='Space'||e.key===' ')&&!g)g=1,s=0,p=0,b.length=0;
 if(z==='ArrowLeft'||z==='ArrowRight')e.preventDefault()
};
onkeyup=e=>{
 let z=e.code||e.key;
 if(z==='d'||z==='D')z='KeyD';
 if(z==='a'||z==='A')z='KeyA';
 k[z]=0
};
c.onpointerdown=()=>c.focus();
for(let i=0;i<70;i++)a.push([Math.random()*2-1,Math.random()*2-1,Math.random()*2+.1]);
function f(){
 x.fillStyle='#02030a';x.fillRect(0,0,w,h);x.fillStyle='#fff';
 a.forEach(o=>{
  o[2]-=.015;
  if(o[2]<.05)o[0]=Math.random()*2-1,o[1]=Math.random()*2-1,o[2]=2;
  let X=w/2+(o[0]-p)*w/o[2],Y=h/2+o[1]*w/o[2],r=2/o[2];
  x.fillRect(X,Y,r,r)
 });
 x.textAlign='left';x.font='14px monospace';x.fillText('SCORE '+s,10,20);
 if(!g){
  x.fillStyle='#fff';x.textAlign='center';x.font='25px monospace';
  x.fillText('GAME OVER',w/2,h/2);x.font='14px monospace';
  x.fillText('PRESS SPACE TO RESTART',w/2,h/2+30);
  requestAnimationFrame(f);return
 }
 if(Math.random()<.04)b.push([Math.random()*2-1,Math.random()*1.2-.6,2]);
 for(let i=b.length-1;i>=0;i--){
  let o=b[i];o[2]-=.02;
  let X=w/2+o[0]*w/o[2]-p*w/2,Y=h/2+o[1]*w/o[2],r=8/o[2];
  x.fillStyle='#777';x.beginPath();x.arc(X,Y,r,0,7);x.fill();
  if(o[2]<.12){
   if(Math.abs(X-(w/2+p*w/2))<r+12&&Math.abs(Y-(h-65))<r+16)g=0;
   else s++;
   b.splice(i,1)
  }
 }
 p+=(k.ArrowRight||k.KeyD?.03:0)-(k.ArrowLeft||k.KeyA?.03:0);
 p=Math.max(-.8,Math.min(.8,p));let q=w/2+p*w/2;
 x.fillStyle='#0ff';x.beginPath();x.moveTo(q,h-90);x.lineTo(q-20,h-45);
 x.lineTo(q,h-55);x.lineTo(q+20,h-45);x.fill();requestAnimationFrame(f)
}
f()
</script>
</body>
</html>
